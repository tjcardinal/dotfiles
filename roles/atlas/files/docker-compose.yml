services:
  homepage:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro

  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    environment:
      - TS_DEBUG_FIREWALL_MODE=nftables
      - TS_ROUTES=192.168.1.0/24
      - TS_USERSPACE=false
    volumes:
      - /docker/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    cap_add:
      - net_admin
      - net_raw
    env_file:
      - .env # TS_AUTHKEY

# Media
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - /docker/jellyfin-config:/config
      - /docker/jellyfin-cache:/cache
      - /mnt/disk2/data/media:/media:ro
    user: 1000:1000

  radarr:
    image: ghcr.io/hotio/radarr:latest
    restart: unless-stopped
    ports:
      - 7878:7878
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Chicago
    volumes:
      - /docker/radarr:/config
      - /mnt/disk2/data:/data

  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    restart: unless-stopped
    ports:
      - 8989:8989
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Chicago
    volumes:
      - /docker/sonarr:/config
      - /mnt/disk2/data:/data

  sabnzbd:
    image: ghcr.io/hotio/sabnzbd:latest
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Chicago
      - WEBUI_PORTS=8080/tcp,8080/udp
      - ARGS
    volumes:
      - /docker/sabnzbd:/config
      - /mnt/disk2/data/usenet:/data/usenet

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    ports:
      - 13378:80
    environment:
      - TZ=America/Chicago
    volumes:
      - /docker/audiobookshelf-config:/config
      - /docker/audiobookshelf-metadata:/metadata
      - /mnt/disk2/data/audiobooks:/audiobooks
      - /mnt/disk2/data/podcasts:/podcasts
    user: 1000:1000

  miniflux:
    image: miniflux/miniflux:latest
    restart: unless-stopped
    ports:
      - 8081:8080
    environment:
      - DATABASE_URL=postgres://miniflux:secret@db/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=adminadmin1
    depends_on:
      miniflux-db:
        condition: service_healthy

  miniflux-db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=miniflux
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=miniflux
    volumes:
      - /docker/miniflux-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s

